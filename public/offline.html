<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión — TV Gratis</title>
    <meta name="theme-color" content="#131722" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #131722;
        color: #d1d4dc;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 360px;
        background: #1e222d;
        border: 1px solid #2a2e39;
        border-radius: 12px;
        padding: 28px 24px;
      }
      h1 { margin: 0 0 8px; font-size: 18px; }
      p { margin: 0 0 18px; color: #787b86; font-size: 14px; line-height: 1.5; }
      button {
        background: #2962ff;
        color: white;
        border: 0;
        border-radius: 8px;
        padding: 12px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        min-height: 44px;
      }
      button:hover { background: #1e53e0; }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #ef5350;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p style="color:#ef5350; font-size:12px; margin-bottom:12px;">
        <span class="dot"></span>Sin conexión
      </p>
      <h1>No hay red disponible</h1>
      <p>Vuelve a intentarlo cuando recuperes la conexión. Los datos de mercado en vivo requieren red activa.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
